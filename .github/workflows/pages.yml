# Deploys the site to GitHub Pages with a live social card: the kit's
# og-preview workflow screenshots the live map into assets/og-card.jpg every
# 6 hours. The image is never committed. Pages source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  pages:
    uses: mt-climate-office/mco-web-style/.github/workflows/og-preview.yml@v1.4.0
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    with:
      url: https://snow.climate.umt.edu/?theme=light
      image_url: https://snow.climate.umt.edu/assets/og-card.jpg
      width: 1800
      height: 945
      scale: '1.3333333333'
      seen_keys: mco-snowpack-info-seen
      settle_ms: 5000
